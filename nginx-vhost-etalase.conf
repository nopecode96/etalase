# ==============================================================================
# Nginx Virtual Host Reverse Proxy untuk "etalase.online" & Custom Domains Klien
# Tempelkan konfigurasi ini ke Nginx utama VPS (misal: locallytrip-nginx-prod atau /etc/nginx/conf.d/)
# ==============================================================================

server {
    listen 80;
    # Mendukung domain utama, subdomain, dan custom domain mandiri klien
    server_name etalase.online www.etalase.online *.etalase.online;

    client_max_body_size 25M;

    location / {
        # Gunakan Docker Host Gateway (172.17.0.1) jika Nginx berjalan di container terpisah,
        # atau arahkan ke 127.0.0.1 jika Nginx berjalan langsung di host system VPS.
        proxy_pass http://172.17.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
