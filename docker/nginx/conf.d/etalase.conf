# Upstream Next.js app running inside etalase_net on PORT=3005
upstream etalase_upstream {
    server web:3005;
    keepalive 32;
}

# Upstream n8n automation microservice
upstream n8n_upstream {
    server n8n:5678;
    keepalive 16;
}

# -------------------------------------------------------------
# HTTP Server (Port 80 inside container)
# Multi-tenant: etalase.online, *.etalase.online, mabes.etalase.online, custom domains
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name etalase.online *.etalase.online localhost;

    # Direct static file serving for uploads
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ACME / Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Next.js App Router (PORT 3005)
    location / {
        proxy_pass http://etalase_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;
    }
}

# -------------------------------------------------------------
# Private Flow / n8n Subdomain: flow.etalase.online
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flow.etalase.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
