version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: etalase_postgres
    restart: always
    environment:
      POSTGRES_USER: etalase_user
      POSTGRES_PASSWORD: etalase_password
      POSTGRES_DB: etalase_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - etalase_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etalase_web
    restart: always
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: "postgresql://etalase_user:etalase_password@db:5432/etalase_db?schema=public"
      PORT: 3005
      NEXTAUTH_URL: "http://etalase.online:3005"
    depends_on:
      - db
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["node", "server.js"]
    networks:
      - etalase_net

  nginx:
    image: nginx:alpine
    container_name: etalase_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - etalase_net

volumes:
  postgres_data:

networks:
  etalase_net:
    driver: bridge
